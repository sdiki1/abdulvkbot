services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: natalia-vk-bot:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_PATH: /data/bot.sqlite3
    volumes:
      - bot_data:/data
    command: ["python", "bot.py"]

  admin:
    image: natalia-vk-bot:latest
    restart: unless-stopped
    depends_on:
      - bot
    env_file:
      - .env
    environment:
      DB_PATH: /data/bot.sqlite3
      ADMIN_HOST: 0.0.0.0
      ADMIN_PORT: 8080
    volumes:
      - bot_data:/data
    ports:
      - "${ADMIN_PUBLISHED_PORT:-8080}:8080"
    command: ["python", "admin.py"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          response=urllib.request.urlopen('http://127.0.0.1:8080/login', timeout=3);
          raise SystemExit(0 if response.status == 200 else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  bot_data:
